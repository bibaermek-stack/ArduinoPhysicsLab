<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arduino Physics Lab{% endblock %}</title>
  <meta name="description" content="{% block description %}Мектеп физика зертханасы: Arduino датчиктерімен нақты уақытта өлшеу, Windows қолданбасы, мұғалім/оқушы кабинеттері мен зертхана журналы.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="kk_KZ">
  <meta property="og:site_name" content="Arduino Physics Lab">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ request.url_for('static', path='favicon.svg') }}">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body>
  <a class="skip" href="#main">Негізгі мазмұнға өту</a>
  <div class="orbit a"></div>
  <div class="orbit b"></div>
  <div class="wrap">
    <nav class="nav" aria-label="Негізгі">
      <a class="brand" href="/"><span class="mark">APL</span> Arduino Physics Lab</a>
      <div class="nav-links">
        {% if account %}
          <a href="/app" class="{{ 'is-active' if request.url.path == '/app' else '' }}">Кабинет</a>
          <a href="/people" class="{{ 'is-active' if request.url.path == '/people' else '' }}">Адамдар</a>
          <a href="/profile" class="{{ 'is-active' if request.url.path == '/profile' else '' }}">Профиль</a>
          <a href="/download" class="{{ 'is-active' if request.url.path.startswith('/download') else '' }}">Жүктеу</a>
          <a href="/logout">Шығу</a>
        {% else %}
          <a href="/download" class="{{ 'is-active' if request.url.path.startswith('/download') else '' }}">Жүктеу</a>
          <a href="/login" class="{{ 'is-active' if request.url.path == '/login' else '' }}">Кіру</a>
          <a class="nav-cta" href="/register">Тіркелу</a>
        {% endif %}
      </div>
    </nav>
    <main id="main" class="page">
      {% block body %}{% endblock %}
    </main>
    <footer class="footer">
      <span>Мектеп физикасына арналған цифрлық зертхана</span>
      <span>
        <a href="/download">Windows қолданбасы</a>
        ·
        <a href="/login">Кіру</a>
      </span>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
