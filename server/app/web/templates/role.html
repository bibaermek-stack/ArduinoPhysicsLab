{% extends "base.html" %}
{% block title %}Рөл · Arduino Physics Lab{% endblock %}
{% block body %}
<section class="card role-narrow">
  <span class="kicker">Бір рет таңдалады</span>
  <h1>Кімсіз?</h1>
  <p class="lead">Рөл кейін өзгертілмейді. Таңдаған соң сізге T- немесе S- ID беріледі.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/role" class="role-grid">
    <button class="role-card teacher" type="submit" name="role" value="teacher">
      <strong>Мен мұғаліммін</strong>
      <span>Сынып, оқушыларды іздеу және зертханалық жұмысты бақылау.</span>
    </button>
    <button class="role-card student" type="submit" name="role" value="student">
      <strong>Мен оқушымын</strong>
      <span>Мұғалімсіз бастап, кейін кодпен сыныпқа қосылу.</span>
    </button>
  </form>
</section>
{% endblock %}
